<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1480" viewBox="0 0 2000 1480" role="img" aria-labelledby="title desc">
<title id="title">Fantasy Football Recommender: detailed system architecture</title>
<desc id="desc">Two flows: an interactive web request through the API and recommendation modules to a validated snapshot, and a scheduled ingestion path through provider adapters, validation, staging, and atomic publication. Manual roster entry and stale-data warnings are shown.</desc>
