<text x="70" y="1372" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#33465e" font-weight="400">Read-only platform import is gated on permission. Requests never wait on provider fetches. Ingestion never exposes partial snapshots.</text>
<text x="70" y="1402" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#33465e" font-weight="400">Waiver and trade analysis are later modules; Redis, queues, and multiple API instances are optional after measured need.</text>
